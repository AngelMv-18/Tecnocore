// Shim: emulate the Claude-artifact "window.storage" API using a real
// backend (Railway: tecnocore-api + MySQL), so every device/browser that
// opens this page shares the same data instead of each keeping its own copy.
const TECNOCORE_API = "https://tecnocore-api-production.up.railway.app";

window.storage = {
  get: async (key) => {
    try {
      const res = await fetch(`${TECNOCORE_API}/storage/${encodeURIComponent(key)}`);
      if (res.status === 404) return null;
      if (!res.ok) return null;
      const data = await res.json();
      return { key, value: data.value };
    } catch (e) {
      return null;
    }
  },
  set: async (key, value) => {
    try {
      const res = await fetch(`${TECNOCORE_API}/storage/${encodeURIComponent(key)}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ value }),
      });
      if (!res.ok) return null;
      return { key, value };
    } catch (e) {
      return null;
    }
  },
};

const BRAND_PALETTE = ["#E8823C", "#5B9BD5", "#4CAF6D", "#E0B341", "#B565D8", "#4FBDBA", "#E2574C", "#8AA6C1"];

function brandColor(brand) {
  const str = (brand || "?").trim();
  let hash = 0;
  for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
  return BRAND_PALETTE[Math.abs(hash) % BRAND_PALETTE.length];
}

function brandInitials(brand) {
  const words = (brand || "?").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return "?";
  if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
  return (words[0][0] + words[1][0]).toUpperCase();
}

function formatPrice(n) {
  const num = Number(n) || 0;
  return `L. ${num.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
}

function stockStatus(qty) {
  if (qty <= 0) return { label: "Agotado", color: COLORS.danger, bg: COLORS.dangerDark };
  if (qty <= 3) return { label: "Stock bajo", color: COLORS.warning, bg: COLORS.warningDark };
  return { label: "Disponible", color: COLORS.success, bg: COLORS.successDark };
}

function hasOffer(p) {
  return p.offerPrice !== "" && p.offerPrice !== null && p.offerPrice !== undefined && Number(p.offerPrice) > 0 && Number(p.offerPrice) < Number(p.price);
}

function Reveal({ children, delay = 0, style = {} }) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            setVisible(true);
            obs.unobserve(entry.target);
          }
        });
      },
      { threshold: 0.15 }
    );
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return (
    <div
      ref={ref}
      style={{
        opacity: visible ? 1 : 0,
        transform: visible ? "translateY(0)" : "translateY(28px)",
        transition: `opacity 0.7s cubic-bezier(0.16,1,0.3,1) ${delay}s, transform 0.7s cubic-bezier(0.16,1,0.3,1) ${delay}s`,
        ...style,
      }}
    >
      {children}
    </div>
  );
}

function BootLoader() {
  const [progress, setProgress] = useState(0);
  const [lineIdx, setLineIdx] = useState(0);

  useEffect(() => {
    const interval = window.setInterval(() => {
      setProgress((p) => Math.min(100, p + Math.random() * 16 + 6));
    }, 90);
    return () => window.clearInterval(interval);
  }, []);

  useEffect(() => {
    const timers = BOOT_LINES.map((_, i) => window.setTimeout(() => setLineIdx((n) => Math.max(n, i + 1)), i * 220));

                </span>
              )}
            </div>
          ))}
          {lineIdx >= BOOT_LINES.length && (
            <div><span style={{ color: "#9d4edd" }}>tecnocore@sistema:~$</span> <span className="boot-cursor">▍</span></div>
          )}
        </div>
        <div style={{ padding: "0 16px 18px" }}>
          <div style={{ height: 6, borderRadius: 4, background: "#1F2226", overflow: "hidden" }}>
            <div
              style={{
                height: "100%",
                width: `${progress}%`,
                background: "linear-gradient(90deg, #00f2fe, #9d4edd, #f72585)",
                transition: "width 0.15s linear",
              }}
            />
          </div>
          <p style={{ fontSize: 11, color: "#5F656D", marginTop: 6, textAlign: "right" }}>{Math.floor(progress)}%</p>
        </div>
      </div>
    </div>
  );
}

  useEffect(() => {
    const canvas = networkCanvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    let width = 0;
    let height = 0;
    let ribbons = [];
    let animId = null;

    const HUE_PAIRS = [
      [230, 280], // azul -> violeta
      [280, 320], // violeta -> magenta
      [320, 350], // magenta -> rosa
      [45, 20],   // amarillo -> naranja
      [190, 220], // cian -> azul
      [55, 40],   // amarillo -> naranja oscuro
    ];

    function buildRibbons() {
      const count = Math.max(6, Math.min(9, Math.floor(width / 130)));
      const list = [];
      for (let i = 0; i < count; i++) {
        const startX = (width / count) * i + (Math.random() - 0.5) * (width / count) * 0.6 - width * 0.3;
        let x = startX;
        let y = -80;
        const points = [{ x, y }];
        let guard = 0;
        while (y < height + 80 && guard < 200) {
          guard++;
          if (Math.random() < 0.4) {
            const jogX = 25 + Math.random() * 45;
            x += jogX;
            points.push({ x, y });
            y += 18 + Math.random() * 14;
            points.push({ x, y });
          } else {
            const stepY = 70 + Math.random() * 90;
            x += stepY * (0.85 + Math.random() * 0.35);
            y += stepY;
            points.push({ x, y });
          }
        }
        let total = 0;
        const lens = [0];
        for (let j = 1; j < points.length; j++) {
          total += Math.hypot(points[j].x - points[j - 1].x, points[j].y - points[j - 1].y);
          lens.push(total);
        }
        const [h1, h2] = HUE_PAIRS[i % HUE_PAIRS.length];
        list.push({
          points, lens, total,
          h1, h2,
          speed: 0.5 + Math.random() * 0.6,
          phase: Math.random() * 5000,
          glowWidth: 12 + Math.random() * 8,
        });
      }
      ribbons = list;
    }

    function pointAt(rb, d) {
      const total = rb.total || 1;
      d = ((d % total) + total) % total;
      for (let i = 1; i < rb.lens.length; i++) {
        if (d <= rb.lens[i]) {
          const segLen = rb.lens[i] - rb.lens[i - 1];
          const t = segLen === 0 ? 0 : (d - rb.lens[i - 1]) / segLen;
          const a = rb.points[i - 1];
          const b = rb.points[i];
          return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
        }
      }
      return rb.points[rb.points.length - 1];
    }

    function setup() {
      const docHeight = Math.max(document.documentElement.scrollHeight, window.innerHeight);
      width = window.innerWidth;
      height = docHeight;
      canvas.width = width;
      canvas.height = height;
      canvas.style.height = height + "px";
      buildRibbons();
    }

    function draw(time) {
      ctx.clearRect(0, 0, width, height);
      ctx.lineJoin = "round";
      ctx.lineCap = "round";

      for (const rb of ribbons) {
        const first = rb.points[0];
        const last = rb.points[rb.points.length - 1];
        const grad = ctx.createLinearGradient(first.x, first.y, last.x, last.y);
        grad.addColorStop(0, `hsl(${rb.h1}, 90%, 62%)`);
        grad.addColorStop(1, `hsl(${rb.h2}, 90%, 62%)`);

        ctx.beginPath();
        rb.points.forEach((p, i) => (i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y)));
        ctx.shadowColor = `hsl(${rb.h1}, 90%, 60%)`;
        ctx.shadowBlur = 22;
        ctx.strokeStyle = grad;
        ctx.globalAlpha = 0.28;
        ctx.lineWidth = rb.glowWidth;
        ctx.stroke();

        ctx.shadowBlur = 0;
        ctx.globalAlpha = 0.95;
        ctx.lineWidth = 2.2;
        ctx.stroke();
        ctx.globalAlpha = 1;

        rb.points.forEach((p, i) => {
          if (i % 2 === 1 && Math.random() < 0.02) {
            const localHue = rb.h1 + (rb.h2 - rb.h1) * (i / rb.points.length);
            ctx.beginPath();
            ctx.shadowColor = `hsl(${localHue}, 90%, 65%)`;
            ctx.shadowBlur = 10;
            ctx.fillStyle = `hsl(${localHue}, 95%, 80%)`;
            ctx.arc(p.x, p.y, 2.6, 0, Math.PI * 2);
            ctx.fill();
          }
        });

        const pulse = pointAt(rb, time * 0.09 * rb.speed + rb.phase);
        const pulseHue = rb.h1 + (rb.h2 - rb.h1) * 0.5;
        ctx.shadowColor = `hsl(${pulseHue}, 100%, 75%)`;
        ctx.shadowBlur = 20;
        ctx.fillStyle = `hsl(${pulseHue}, 100%, 90%)`;
        ctx.beginPath();
        ctx.arc(pulse.x, pulse.y, 3.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }
      animId = window.requestAnimationFrame(draw);
    }

    function onScroll() {
      const deg = (window.scrollY * 0.18) % 360;
      canvas.style.filter = `hue-rotate(${deg}deg)`;
    }
    function onResize() {
      setup();
    }

    setup();
    animId = window.requestAnimationFrame(draw);
    onScroll();
    window.addEventListener("resize", onResize);
    window.addEventListener("scroll", onScroll, { passive: true });

    const heightCheck = window.setInterval(() => {

  const TAX_RATE = 0.15;

    const todayKey = new Date().toDateString();

      const d = new Date();
      d.setDate(d.getDate() - i);
      const key = d.toDateString();
      const total = ventasHistorial.filter((v) => new Date(v.fecha).toDateString() === key).reduce((s, v) => s + v.total, 0);
      last7.push({ label: d.toLocaleDateString("es-HN", { weekday: "short" }), total });

    const maxDay = Math.max(1, ...last7.map((d) => d.total));

  function addToPos(id) {
    const product = productos.find((p) => p.id === id);

    setPosItems((c) => {
      const current = c[id] || 0;
      if (current >= Number(product.stock)) return c;
      return { ...c, [id]: current + 1 };
    });
  }

  function changePosQty(id, delta) {
    const product = productos.find((p) => p.id === id);
    setPosItems((c) => {
      const next = { ...c };
      let qty = (next[id] || 0) + delta;
      if (product) qty = Math.min(qty, Number(product.stock));
      if (qty <= 0) delete next[id];
      else next[id] = qty;
      return next;
    });
  }

  function removeFromPos(id) {

    if (posLines.length === 0) return;
    const updatedProducts = productos.map((p) => {

      return { ...p, stock: Math.max(0, Number(p.stock) - line.qty) };

    persistProductos(updatedProducts);

    const vuelto = typeof recibido === "number" ? Math.max(0, recibido - posTotal) : 0;

  function handleComprobanteFile(e) {
    try {
      const file = e.target.files && e.target.files[0];
      e.target.value = "";
      if (!file) return;
      if (!file.type || !file.type.startsWith("image/")) {
        setTransferError("Elegí una imagen (captura de pantalla).");
        return;
      }
      setTransferError("");
      const reader = new FileReader();
      reader.onerror = () => setTransferError("No se pudo leer la imagen. Probá de nuevo.");
      reader.onload = (ev) => {
        try {
          const img = new Image();
          img.onerror = () => setTransferError("No se pudo procesar la imagen. Probá de nuevo.");
          img.onload = () => {
            try {
              const maxDim = 500;
              let { width, height } = img;
              if (width > height && width > maxDim) {
                height = Math.round(height * (maxDim / width));
                width = maxDim;
              } else if (height > maxDim) {
                width = Math.round(width * (maxDim / height));
                height = maxDim;
              }
              const canvas = document.createElement("canvas");
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext("2d");
              ctx.drawImage(img, 0, 0, width, height);
              setComprobanteImg(canvas.toDataURL("image/jpeg", 0.7));
            } catch (err) {
              setTransferError("No se pudo procesar la imagen.");
            }
          };
          img.src = ev.target.result;
        } catch (err) {
          setTransferError("No se pudo procesar la imagen.");
        }
      };
      reader.readAsDataURL(file);
    } catch (err) {
      setTransferError("No se pudo abrir el selector de archivos.");
    }
  }

      `*Pedido:*\n${lines.join("\n")}\n` +
      `━━━━━━━━━━━━━\n` +

  function assignRiderToOrder(pedidoId, riderId) {
    const rider = riders.find((r) => r.id === riderId);
    if (!rider) return;
    persistPedidosOnline(
      pedidosOnline.map((p) => (p.id === pedidoId ? { ...p, riderId: rider.id, riderName: rider.name, estado: "asignado", riderResponse: "pendiente" } : p))

  function marcarEntregado(pedidoId) {
    persistPedidosOnline(pedidosOnline.map((p) => (p.id === pedidoId ? { ...p, estado: "entregado" } : p)));
  }

  function riderAccept(pedidoId) {
    persistPedidosOnline(pedidosOnline.map((p) => (p.id === pedidoId ? { ...p, riderResponse: "aceptado" } : p)));
  }

  function riderReject(pedidoId) {
    const pedido = pedidosOnline.find((p) => p.id === pedidoId);
    if (!pedido) return;
    const siguienteRider = riders.find((r) => r.activo && r.id !== pedido.riderId);

    if (siguienteRider) {
      persistPedidosOnline(
        pedidosOnline.map((p) =>
          p.id === pedidoId ? { ...p, riderId: siguienteRider.id, riderName: siguienteRider.name, riderResponse: "pendiente" } : p
        )
      );
      window.open(buildRiderMessageUrl(pedido, siguienteRider), "_blank");
    } else {
      persistPedidosOnline(
        pedidosOnline.map((p) => (p.id === pedidoId ? { ...p, riderId: null, riderName: "", estado: "pendiente", riderResponse: "" } : p))
      );
    }
  }

  function buildReportUrl() {

        `Un cliente reportó lo siguiente sobre una entrega tuya:\n\n` +
        (reportForm.pedido.trim() ? `🔖 *Pedido:* #${reportForm.pedido.trim()}\n` : "") +
        `👤 *Cliente:* ${reportForm.nombre.trim()}\n\n` +
        `📝 *Detalle:*\n${reportForm.mensaje.trim()}\n\n` +
        `¿Es cierto esto? Por favor respondenos.\n` +
        `Si se confirma, se te aplicará un descuento correspondiente.`;
      return `https://wa.me/${rider.phone}?text=${encodeURIComponent(text)}`;
    }

    const tipoLabel = reportForm.tipo === "delivery" ? "Delivery" : reportForm.tipo === "producto" ? "Producto" : "Otro";
    const text =
      `⚠️ *Reporte de cliente — Tecnocore*\n\n` +
      `👤 *Cliente:* ${reportForm.nombre.trim()}\n` +
      (reportForm.telefono.trim() ? `📞 *Teléfono:* ${reportForm.telefono.trim()}\n` : "") +

  function submitReport() {
    const e = validateReport();
    setReportErrors(e);

    const rider = reportTargetRider();
    const reporte = {
      id: Date.now().toString(),
      nombre: reportForm.nombre.trim(),
      telefono: reportForm.telefono.trim(),
      tipo: reportForm.tipo,
      pedido: reportForm.pedido.trim(),
      riderId: rider ? rider.id : "",
      riderName: rider ? rider.name : "",
      mensaje: reportForm.mensaje.trim(),
      fecha: new Date().toISOString(),
      estado: "abierto",
    };
    persistReportes([reporte, ...reportes]);
    setReportSent(true);

  function toggleReporteResuelto(id) {
    persistReportes(reportes.map((r) => (r.id === id ? { ...r, estado: r.estado === "resuelto" ? "abierto" : "resuelto" } : r)));

  function openLogin(target) {
    setLoginTarget(target);
    setPinInput("");
    setLoginError("");
    setLoginOpen(true);
  }

  function submitLogin() {
    if (loginTarget === "admin") {
      if (!config.adminPin) {
        if (pinInput.length < 4) {
          setLoginError("Elegí un PIN de al menos 4 dígitos para crear el acceso admin");
          return;
        }
        persistConfig({ ...config, adminPin: pinInput });
        setRole("admin");
        setLoginOpen(false);
        return;
      }
      if (pinInput === config.adminPin) {
        setRole("admin");
        setLoginOpen(false);
      } else {
        setLoginError("PIN incorrecto");
      }
    } else if (loginTarget === "rider") {
      if (!config.riderPin) {
        setLoginError("Todavía no hay un PIN de riders configurado. Pedíselo al admin.");
        return;
      }
      if (pinInput !== config.riderPin) {
        setLoginError("PIN incorrecto");
        return;
      }
      if (riders.filter((r) => r.activo).length === 0) {
        setLoginError("No hay riders activos cargados todavía.");
        return;
      }
      setLoginOpen(false);
      setRiderPickOpen(true);
    } else {
      if (!config.empleadoPin) {
        setLoginError("Todavía no hay un PIN de empleado configurado. Pedíselo al admin.");
        return;
      }
      if (pinInput === config.empleadoPin) {
        setRole("empleado");
        setLoginOpen(false);
      } else {
        setLoginError("PIN incorrecto");
      }
    }
  }

    setCurrentRiderId(riderId);
    setRole("rider");
    setRiderPickOpen(false);
  }

  function logout() {
    setRole("cliente");
    setCurrentRiderId("");

    setForm(emptyForm);

    setImageError("");
    setEditingId(null);
    setFormOpen(true);
  }

  function openEditForm(p) {
    setForm({
      name: p.name,
      category: p.category,
      brand: p.brand,
      specs: p.specs,
      price: String(p.price),
      offerPrice: p.offerPrice ? String(p.offerPrice) : "",
      stock: String(p.stock),
      sku: p.sku,
      imageUrl: p.imageUrl || "",
    });

    setEditingId(p.id);

  function closeForm() {
    setFormOpen(false);
    setEditingId(null);
    setForm(emptyForm);
    setErrors({});
    setImageError("");
  }

  function validate() {
    const e = {};
    if (!form.name.trim()) e.name = "Ingresá un nombre";
    if (!form.brand.trim()) e.brand = "Ingresá una marca";
    if (canSeePrice) {
      if (form.price === "" || isNaN(Number(form.price)) || Number(form.price) < 0) e.price = "Precio inválido";
      if (form.offerPrice !== "" && (isNaN(Number(form.offerPrice)) || Number(form.offerPrice) < 0)) e.offerPrice = "Precio de oferta inválido";
      if (form.offerPrice !== "" && Number(form.offerPrice) >= Number(form.price)) e.offerPrice = "Debe ser menor al precio normal";
    }
    if (form.stock === "" || isNaN(Number(form.stock)) || Number(form.stock) < 0 || !Number.isInteger(Number(form.stock)))
      e.stock = "Cantidad inválida";
    return e;
  }

  function handleSubmit() {
    const e = validate();
    setErrors(e);
    if (Object.keys(e).length > 0) return;

    const existing = editingId ? productos.find((p) => p.id === editingId) : null;
    const payload = {
      name: form.name.trim(),
      category: form.category,
      brand: form.brand.trim(),
      specs: form.specs.trim(),
      price: canSeePrice ? Number(form.price) : existing ? existing.price : 0,
      offerPrice: canSeePrice ? (form.offerPrice === "" ? "" : Number(form.offerPrice)) : existing ? existing.offerPrice : "",
      stock: Number(form.stock),
      sku: form.sku.trim() || `SKU-${Date.now().toString().slice(-6)}`,
      imageUrl: form.imageUrl.trim(),
    };

    if (editingId) {
      persistProductos(productos.map((p) => (p.id === editingId ? { ...p, ...payload } : p)));
    } else {
      persistProductos([{ id: Date.now().toString(), ...payload }, ...productos]);
    }
    closeForm();
  }

  function handleDelete(id) {
    if (confirmDeleteId === id) {
      persistProductos(productos.filter((p) => p.id !== id));
      setConfirmDeleteId(null);
    } else {
      setConfirmDeleteId(id);
    }
  }

  function adjustStock(id, delta) {
    persistProductos(
      productos.map((p) => (p.id === id ? { ...p, stock: Math.max(0, Number(p.stock) + delta) } : p))
    );
  }

  function submitSettings() {
    const next = { ...config };

    if (newAdminPin.trim()) {
      if (newAdminPin.trim().length < 4) {
        setSettingsMsg("El PIN de admin debe tener al menos 4 dígitos");
        return;
      }
      next.adminPin = newAdminPin.trim();
      changed = true;
    }
    if (newEmpleadoPin.trim()) {
      if (newEmpleadoPin.trim().length < 4) {
        setSettingsMsg("El PIN de empleado debe tener al menos 4 dígitos");
        return;
      }
      next.empleadoPin = newEmpleadoPin.trim();
      changed = true;
    }
    if (newRiderPin.trim()) {
      if (newRiderPin.trim().length < 4) {
        setSettingsMsg("El PIN de riders debe tener al menos 4 dígitos");
        return;
      }
      next.riderPin = newRiderPin.trim();
      changed = true;
    }
    if (newWhatsapp.trim()) {
      next.whatsappNumber = newWhatsapp.trim().replace(/[^0-9]/g, "");
      changed = true;
    }
    const banks = { ...(config.bankAccounts || { bac: "", atlantida: "", ficohsa: "" }) };
    if (newBac.trim()) { banks.bac = newBac.trim(); changed = true; }
    if (newAtlantida.trim()) { banks.atlantida = newAtlantida.trim(); changed = true; }
    if (newFicohsa.trim()) { banks.ficohsa = newFicohsa.trim(); changed = true; }
    next.bankAccounts = banks;
    if (changed) persistConfig(next);
    setNewAdminPin("");
    setNewEmpleadoPin("");
    setNewRiderPin("");
    setNewWhatsapp("");
    setNewBac("");
    setNewAtlantida("");
    setNewFicohsa("");
    setSettingsMsg(changed ? "Guardado" : "");

  function CartControl({ p }) {
    const qty = cart[p.id] || 0;
    const outOfStock = Number(p.stock) <= 0;

      addToCart(p.id);

      <div className={pop ? "cs-rgb-pop" : ""} style={{ width: "100%" }}>

                </div>
              </div>

              <div className="flex justify-end gap-2 mt-2">
                <button type="button" className="cs-btn cs-btn-ghost" onClick={closeForm}>Cancelar</button>
                <button type="button" className="cs-btn cs-btn-primary" onClick={handleSubmit}>
                  {editingId ? "Guardar cambios" : "Agregar al catálogo"}
                </button>
              </div>
            </div>
          </div>
        </div>
      )}

      <div style={{ padding: "2.8rem 1.25rem 3.2rem", background: COLORS.surface, clipPath: "polygon(0 3%, 100% 0, 100% 100%, 0 97%)", marginBottom: "2.5rem" }}>
        <div className="max-w-5xl mx-auto grid grid-cols-2 sm:grid-cols-4 gap-6">
          {[
            { key: "envios", icon: "truck", title: "Envíos", sub: "A todo el país" },
            { key: "garantia", icon: "shieldCheck", title: "Garantía", sub: "Respaldo real" },
            { key: "pago", icon: "creditCard", title: "Pago seguro", sub: "Varios medios" },
            { key: "soporte", icon: "headphones", title: "Soporte", sub: "Atención directa" },
          ].map((b) => (
            <button key={b.title} className="cs-badge-btn flex flex-col sm:flex-row items-center sm:items-start gap-2 text-center sm:text-left" onClick={() => setInfoOpen(b.key)}>
              <div style={{ width: 38, height: 38, borderRadius: 8, background: COLORS.bg, border: `1px solid ${COLORS.border}`, display: "flex", alignItems: "center", justifyContent: "center", color: COLORS.accent, flexShrink: 0 }}>
                <Icon name={b.icon} size={17} />
              </div>
              <div>
                <p style={{ fontSize: 13, fontWeight: 600, color: COLORS.text }}>{b.title}</p>
                <p style={{ fontSize: 11, color: COLORS.textMuted }}>{b.sub}</p>
              </div>
            </button>
          ))}
        </div>
      </div>

      {infoOpen && (
        <div style={{ background: "rgba(0,0,0,0.55)", position: "fixed", inset: 0, zIndex: 50, overflowY: "auto" }} className="flex items-center justify-center p-4 cs-modal-backdrop" onClick={() => setInfoOpen(null)}>
          <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.border}` }} className="cs-modal-pop cs-card w-full max-w-sm p-5" onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center justify-between mb-4">
              <h2 style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 500 }} className="text-lg flex items-center gap-2">
                {infoOpen === "envios" && (<><Icon name="truck" size={17} style={{ color: COLORS.accent }} /> Envíos</>)}
                {infoOpen === "garantia" && (<><Icon name="shieldCheck" size={17} style={{ color: COLORS.accent }} /> Garantía</>)}
                {infoOpen === "pago" && (<><Icon name="creditCard" size={17} style={{ color: COLORS.accent }} /> Pago seguro</>)}
                {infoOpen === "soporte" && (<><Icon name="headphones" size={17} style={{ color: COLORS.accent }} /> Soporte</>)}
              </h2>
              <button className="cs-icon-btn" onClick={() => setInfoOpen(null)} aria-label="Cerrar"><Icon name="x" size={14} /></button>
            </div>

            {infoOpen === "envios" && (
              <div className="flex flex-col gap-3">
                <p style={{ color: COLORS.textSecondary, fontSize: 14, lineHeight: 1.6 }}>
                  Hacemos envíos a todo el país. El costo y tiempo de entrega se coordinan por WhatsApp una vez confirmado tu pedido, según tu ubicación.
                </p>
                <label className="flex items-center gap-2" style={{ fontSize: 13, color: COLORS.text, cursor: "pointer" }}>
                  <input type="checkbox" checked={wantsShipping} onChange={(e) => setWantsShipping(e.target.checked)} />
                  Quiero que mi pedido incluya envío a domicilio
                </label>
                <button className="cs-btn cs-btn-ghost" onClick={() => { setInfoOpen(null); setCartOpen(true); }}>
                  Ir al carrito
                </button>
              </div>
            )}

            {infoOpen === "garantia" && (
              <div className="flex flex-col gap-3" style={{ color: COLORS.textSecondary, fontSize: 14, lineHeight: 1.6 }}>
                <p><strong style={{ color: COLORS.text }}>30 días</strong> de garantía por defectos de fábrica, cubierta por el fabricante del producto.</p>
                <p><strong style={{ color: COLORS.text }}>60 días</strong> adicionales de garantía propia de Tecnocore, sin cargo.</p>
                <p style={{ fontSize: 12, color: COLORS.textMuted }}>Ante cualquier problema, contactanos por WhatsApp con tu comprobante de compra.</p>
              </div>
            )}

            {infoOpen === "pago" && (
              <div className="flex flex-col gap-3" style={{ color: COLORS.textSecondary, fontSize: 14, lineHeight: 1.6 }}>
                <p>Aceptamos efectivo, transferencia bancaria y tarjetas de débito/crédito.</p>
                <p style={{ fontSize: 12, color: COLORS.textMuted }}>El medio de pago se coordina por WhatsApp al confirmar el pedido.</p>
              </div>
            )}

            {infoOpen === "soporte" && (
              <div className="flex flex-col gap-3">
                <p style={{ color: COLORS.textSecondary, fontSize: 14, lineHeight: 1.6 }}>
                  ¿Tenés un problema con un producto o una duda? Escribinos directo y te ayudamos.
                </p>
                {config.whatsappNumber ? (
                  <a href={openSupportChat()} className="cs-btn cs-btn-primary" style={{ textDecoration: "none" }}>
                    Contactar por WhatsApp
                  </a>
                ) : (
                  <p style={{ color: COLORS.warning, fontSize: 12, background: COLORS.warningDark, borderRadius: 6, padding: "8px 10px" }}>
                    {role === "admin" ? "Configurá tu número de WhatsApp en Configuración para habilitar este botón." : "La tienda todavía no configuró un número de WhatsApp de soporte."}
                  </p>
                )}

                <div style={{ borderTop: `1px solid ${COLORS.border}`, paddingTop: 14, marginTop: 4 }}>
                  <p style={{ fontSize: 13, fontWeight: 500, marginBottom: 8 }}>¿Tuviste un problema con tu pedido o el delivery?</p>

                  {reportSent ? (
                    <p style={{ color: COLORS.success, fontSize: 13, display: "flex", alignItems: "center", gap: 6 }}>
                      <Icon name="check" size={14} /> Reporte enviado, ya lo vamos a revisar.
                    </p>
                  ) : (
                    <div className="flex flex-col gap-2">
                      <input
                        className="cs-input"
                        placeholder="Tu nombre"
                        value={reportForm.nombre}
                        onChange={(e) => { setReportForm({ ...reportForm, nombre: e.target.value }); setReportErrors({ ...reportErrors, nombre: "" }); }}
                      />
                      {reportErrors.nombre && <p style={{ color: COLORS.danger, fontSize: 11 }}>{reportErrors.nombre}</p>}

                      <input
                        className="cs-input"
                        placeholder="Teléfono (opcional)"
                        value={reportForm.telefono}
                        onChange={(e) => setReportForm({ ...reportForm, telefono: e.target.value })}
                      />

                      <div className="grid grid-cols-2 gap-2">
                        <div className="relative">
                          <select
                            className="cs-input"
                            style={{ appearance: "none" }}
                            value={reportForm.tipo}
                            onChange={(e) => setReportForm({ ...reportForm, tipo: e.target.value })}
                          >
                            <option value="producto">Producto</option>
                            <option value="delivery">Delivery</option>
                            <option value="otro">Otro</option>
                          </select>
                          <Icon name="chevronDown" size={14} style={{ position: "absolute", right: 10, top: "50%", transform: "translateY(-50%)", color: COLORS.textMuted, pointerEvents: "none" }} />
                        </div>
                        <input
                          className="cs-input"
                          placeholder="N° de pedido (opcional)"
                          value={reportForm.pedido}
                          onChange={(e) => {
                            const val = e.target.value;
                            const match = pedidosOnline.find((p) => p.id === val.trim());
                            setReportForm({ ...reportForm, pedido: val, riderId: match && match.riderId ? match.riderId : reportForm.riderId });
                          }}
                        />
                      </div>

                      {reportForm.tipo === "delivery" && riders.length > 0 && (
                        <div className="relative">
                          <select
                            className="cs-input"
                            style={{ appearance: "none" }}
                            value={reportForm.riderId}
                            onChange={(e) => { setReportForm({ ...reportForm, riderId: e.target.value }); setReportErrors({ ...reportErrors, riderId: "" }); }}
                          >
                            <option value="">¿Qué rider hizo la entrega?</option>
                            {riders.map((r) => (
                              <option key={r.id} value={r.id}>{r.name}</option>
                            ))}
                          </select>
                          <Icon name="chevronDown" size={14} style={{ position: "absolute", right: 10, top: "50%", transform: "translateY(-50%)", color: COLORS.textMuted, pointerEvents: "none" }} />
                        </div>
                      )}
                      {reportErrors.riderId && <p style={{ color: COLORS.danger, fontSize: 11 }}>{reportErrors.riderId}</p>}

                      <input
                        className="cs-input"
                        placeholder="Contanos qué pasó…"
                        value={reportForm.mensaje}
                        onChange={(e) => { setReportForm({ ...reportForm, mensaje: e.target.value }); setReportErrors({ ...reportErrors, mensaje: "" }); }}
                      />
                      {reportErrors.mensaje && <p style={{ color: COLORS.danger, fontSize: 11 }}>{reportErrors.mensaje}</p>}

                      <p style={{ fontSize: 11, color: COLORS.textMuted }}>
                        {reportTargetRider()
                          ? `Se le va a enviar directo a ${reportTargetRider().name} por WhatsApp.`
                          : "Se va a enviar a la tienda por WhatsApp."}
                      </p>

                      {(reportTargetRider() || config.whatsappNumber) ? (
                        <a href={buildReportUrl()} className="cs-btn cs-btn-ghost" style={{ textDecoration: "none" }} onClick={submitReport}>
                          Enviar reporte
                        </a>
                      ) : (
                        <button type="button" className="cs-btn cs-btn-ghost" onClick={submitReport}>
                          Enviar reporte
                        </button>
                      )}
                    </div>
                  )}
                </div>
              </div>
            )}
          </div>
        </div>
      )}

      <div ref={catalogRef} className="max-w-5xl mx-auto" style={{ paddingTop: "0.5rem", paddingLeft: "1.25rem", paddingRight: "1.25rem" }}>
        <Reveal>
          <div className="flex items-start justify-between gap-4 mb-2 flex-wrap">
            <div>
              <p className="cs-eyebrow">Catálogo</p>
              <h1 className="cs-section-title">Stock disponible</h1>
              <p style={{ color: COLORS.textSecondary }} className="text-sm mt-1">
                {counts.total} productos · {counts.lowStock} con stock bajo · {counts.outOfStock} agotados
              </p>
            </div>
            {canEdit && (
              <button className="cs-btn cs-btn-primary" onClick={openAddForm}>
                <Icon name="plus" size={16} /> Agregar producto
              </button>
            )}
          </div>
        </Reveal>

        {saveError && (
          <div style={{ background: COLORS.dangerDark, color: COLORS.danger, border: `1px solid ${COLORS.danger}` }} className="rounded-md px-3 py-2 text-sm mb-4 flex items-center gap-2 mt-3">
            <Icon name="alertTriangle" size={14} /> {saveError}
          </div>
        )}

        {ofertas.length > 0 && (
          <div className="mt-6 mb-8">
            <Reveal>
              <p className="cs-eyebrow" style={{ color: COLORS.danger }}>Ofertas</p>
              <h2 className="cs-section-title" style={{ fontSize: "1.4rem", marginBottom: 14 }}>Ofertas destacadas</h2>
            </Reveal>
            <div className="flex gap-4 overflow-x-auto cs-scroll pb-2">
              {ofertas.map((p, i) => (
                <Reveal key={p.id} delay={i * 0.06} style={{ flexShrink: 0 }}>
                  <div className={`cs-card p-4 flex flex-col gap-3 ${cart[p.id] > 0 ? "cs-rgb-active" : ""}`} style={{ minWidth: 220, maxWidth: 220, borderColor: COLORS.danger }}>
                    <div className="flex items-start gap-3">
                      <ProductBadge p={p} />
                      <div>
                        <span style={{ color: COLORS.textMuted, fontFamily: "'IBM Plex Mono', monospace", fontSize: 11 }}>{p.category.toUpperCase()}</span>
                        <h3 style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 500 }} className="text-sm leading-snug">{p.name}</h3>
                      </div>
                    </div>
                    <ProductPrice p={p} />
                    {role === "cliente" ? <CartControl p={p} /> : (
                      <button className="cs-btn cs-btn-ghost" style={{ width: "100%" }} onClick={() => openEditForm(p)}>
                        <Icon name="pencil" size={13} /> Editar
                      </button>
                    )}
                  </div>
                </Reveal>
              ))}
            </div>
          </div>
        )}

        <div className="cs-sticky-nav">
          <div className="flex items-center justify-between gap-3 mb-3 flex-wrap">
            <div className="relative flex-1" style={{ minWidth: 200 }}>
              <Icon name="search" size={15} style={{ color: COLORS.textMuted, position: "absolute", left: 10, top: "50%", transform: "translateY(-50%)" }} />
              <input
                className="cs-input"
                style={{ paddingLeft: 32 }}
                placeholder="Buscar por nombre, marca o SKU…"
                value={query}
                onChange={(e) => setQuery(e.target.value)}
              />
            </div>
          </div>

          <div className="flex gap-1 overflow-x-auto cs-scroll pb-1">
            <button className={`cs-navlink ${activeCategory === "Todas" ? "cs-navlink-active" : ""}`} style={{ padding: "6px 12px" }} onClick={() => setActiveCategory("Todas")}>
              Todas
            </button>
            {CATEGORIES.map((c) => (
              <button key={c} className={`cs-navlink ${activeCategory === c ? "cs-navlink-active" : ""}`} style={{ padding: "6px 12px", whiteSpace: "nowrap" }} onClick={() => setActiveCategory(c)}>
                {c}
              </button>
            ))}
          </div>
        </div>

        <Reveal>
          <p className="cs-eyebrow mt-6">Catálogo completo</p>
          <h2 className="cs-section-title" style={{ fontSize: "1.4rem", marginBottom: 14 }}>Todos los productos</h2>
        </Reveal>

        {filtered.length === 0 ? (
          <div style={{ border: `1px dashed ${COLORS.border}`, color: COLORS.textSecondary }} className="rounded-md py-16 text-center text-sm flex flex-col items-center gap-2">
            <Icon name="packageX" size={22} style={{ color: COLORS.textMuted }} />
            No hay productos que coincidan con la búsqueda.
          </div>
        ) : (
          <div className="grid gap-4" style={{ gridTemplateColumns: "repeat(auto-fill, minmax(240px, 1fr))" }}>
            {filtered.map((p, i) => {
              const status = stockStatus(Number(p.stock));
              const isConfirming = confirmDeleteId === p.id;
              return (
                <Reveal key={p.id} delay={(i % 6) * 0.05}>
                  <div className={`cs-card p-4 flex flex-col gap-3 ${cart[p.id] > 0 ? "cs-rgb-active" : ""}`}>
                    <div className="flex items-start justify-between gap-2">
                      <div className="flex items-start gap-3">
                        <ProductBadge p={p} />
                        <div>
                          <span style={{ color: COLORS.textMuted, fontFamily: "'IBM Plex Mono', monospace", fontSize: 11 }}>
                            {p.category.toUpperCase()}
                          </span>
                          <h3 style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 500 }} className="text-base leading-snug">
                            {p.name}
                          </h3>
                          <p style={{ color: COLORS.textSecondary }} className="text-xs">{p.brand}</p>
                        </div>
                      </div>
                      <span style={{ background: status.bg, color: status.color, fontSize: 11, padding: "3px 8px", borderRadius: 5, whiteSpace: "nowrap" }}>
                        {status.label}
                      </span>
                    </div>

                    {p.specs && (
                      <p style={{ color: COLORS.textSecondary, fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, lineHeight: 1.5 }}>
                        {p.specs}
                      </p>
                    )}

                    <div className="flex items-end justify-between mt-auto pt-2" style={{ borderTop: `1px solid ${COLORS.border}` }}>
                      <div>
                        <ProductPrice p={p} />
                        <p style={{ color: COLORS.textMuted, fontSize: 11 }}>SKU {p.sku}</p>
                      </div>
                      {canEdit && (
                        <div className="flex items-center gap-1">
                          <button className="cs-icon-btn" onClick={() => adjustStock(p.id, -1)} aria-label="Restar stock">−</button>
                          <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, minWidth: 20, textAlign: "center" }}>{p.stock}</span>
                          <button className="cs-icon-btn" onClick={() => adjustStock(p.id, 1)} aria-label="Sumar stock">+</button>
                        </div>
                      )}
                    </div>

                    {canEdit ? (
                      <div className="flex gap-2 justify-end">
                        <button className="cs-icon-btn" onClick={() => openEditForm(p)} aria-label="Editar">
                          <Icon name="pencil" size={13} />
                        </button>
                        {canDelete && (
                          <button
                            className="cs-icon-btn"
                            style={isConfirming ? { borderColor: COLORS.danger, color: COLORS.danger } : {}}
                            onClick={() => handleDelete(p.id)}
                            aria-label={isConfirming ? "Confirmar borrado" : "Borrar"}
                          >
                            {isConfirming ? <Icon name="check" size={13} /> : <Icon name="trash" size={13} />}
                          </button>
                        )}
                      </div>
                    ) : (
                      <CartControl p={p} />
                    )}
                  </div>
                </Reveal>
              );
            })}
          </div>
        )}
      </div>
      </div>
    </div>
  );
}

const rootEl = document.getElementById("root");
const root = ReactDOM.createRoot(rootEl);
root.render(<CatalogoStock />);
</script>
</body>
</html>
